<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}ДСР Діджитал{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f7f7fb; }
        .navbar-brand { font-weight: 600; }
        .card { border-radius: 0.75rem; }
        .footer-note { color: #888; font-size: 0.85rem; }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="/">ДСР · Гуртки та клуби</a>
        <div class="d-flex gap-2">
            {% if user %}
                {% if user.role.value == "staff" %}
                    <a class="btn btn-outline-light btn-sm" href="/vrsp/clubs">Гуртки (ВРСП)</a>
                    <a class="btn btn-outline-light btn-sm" href="/vrsp/requests">Заявки</a>
                    <a class="btn btn-outline-light btn-sm" href="/vrsp/settings">Налаштування</a>
                {% else %}
                    <a class="btn btn-outline-light btn-sm" href="/my/clubs">Мої гуртки</a>
                {% endif %}
                <span class="navbar-text text-white-50">{{ user.full_name }}</span>
                <form method="post" action="/logout" class="d-inline">
                    <button class="btn btn-outline-light btn-sm" type="submit">Вийти</button>
                </form>
            {% else %}
                <a class="btn btn-outline-light btn-sm" href="/clubs/new">Створити гурток</a>
                <a class="btn btn-light btn-sm" href="/login">Увійти</a>
            {% endif %}
        </div>
    </div>
</nav>
<div class="container pb-5">
    {% block content %}{% endblock %}
</div>
</body>
</html>
