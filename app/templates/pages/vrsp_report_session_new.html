{% extends "base.html" %}
{% block title %}Нова сесія звітування{% endblock %}
{% block content %}
<h2 class="mb-3">Відкрити сесію збору звітів</h2>

<form method="post" action="/vrsp/reports/new" class="card">
    <div class="card-body">
        <div class="mb-3">
            <label class="form-label">Рік</label>
            <input type="number" name="year" class="form-control" min="2000" max="2100" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Семестр</label>
            <select name="semester" class="form-select" required>
                <option value="" selected disabled>— оберіть —</option>
                {% for s in semesters %}
                <option value="{{ s.value }}">{{ s | semester_label | capitalize }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="row g-3 mb-3">
            <div class="col-auto">
                <label class="form-label">Початок сесії</label>
                <input type="date" name="start_date" class="form-control" required>
            </div>
            <div class="col-auto">
                <label class="form-label">Завершення сесії</label>
                <input type="date" name="end_date" class="form-control" required>
            </div>
        </div>
        <div class="form-check mb-3">
            <input class="form-check-input" type="checkbox" id="confirm-check" required>
            <label class="form-check-label" for="confirm-check">Підтверджую, що інформація відповідає дійсності</label>
        </div>
        <button type="submit" class="btn btn-primary">Відкрити сесію</button>
    </div>
</form>
{% endblock %}
