{% extends "base.html" %}
{% block title %}Зміна назви гуртка{% endblock %}
{% block content %}
<h2 class="mb-3">Зміна назви гуртка «{{ club.name }}»</h2>
<form method="post" action="/my/clubs/{{ club.id }}/rename" class="card">
    <div class="card-body">
        <div class="mb-3">
            <label class="form-label">Нова назва гуртка</label>
            <input type="text" name="new_name" class="form-control" minlength="{{ name_min }}" maxlength="{{ name_max }}" required>
        </div>
        <div class="form-check mb-3">
            <input class="form-check-input" type="checkbox" id="confirm-rename" required>
            <label class="form-check-label" for="confirm-rename">Підтверджую, що дійсно хочу змінити назву гуртка</label>
        </div>
        <button type="submit" class="btn btn-primary">Заповнити</button>
    </div>
</form>
{% endblock %}
