{% macro pdf_tabs(prefix, order_url, regulation_url=None) %}
{% if regulation_url %}
<ul class="nav nav-tabs" id="{{ prefix }}-tabs" role="tablist">
    <li class="nav-item" role="presentation">
        <button class="nav-link active" id="{{ prefix }}-order-tab" data-bs-toggle="tab"
                data-bs-target="#{{ prefix }}-order-pane" type="button" role="tab"
                aria-controls="{{ prefix }}-order-pane" aria-selected="true">Проєкт наказу</button>
    </li>
    <li class="nav-item" role="presentation">
        <button class="nav-link" id="{{ prefix }}-regulation-tab" data-bs-toggle="tab"
                data-bs-target="#{{ prefix }}-regulation-pane" type="button" role="tab"
                aria-controls="{{ prefix }}-regulation-pane" aria-selected="false">Проєкт Положення</button>
    </li>
</ul>
<div class="tab-content kpi-pdf-tab-content">
    <div class="tab-pane fade show active" id="{{ prefix }}-order-pane" role="tabpanel" aria-labelledby="{{ prefix }}-order-tab">
        <iframe src="{{ order_url }}" class="kpi-pdf-frame" title="Проєкт наказу"></iframe>
    </div>
    <div class="tab-pane fade" id="{{ prefix }}-regulation-pane" role="tabpanel" aria-labelledby="{{ prefix }}-regulation-tab">
        <iframe src="{{ regulation_url }}" class="kpi-pdf-frame" title="Проєкт Положення"></iframe>
    </div>
</div>
{% else %}
<iframe src="{{ order_url }}" class="kpi-pdf-frame" title="Проєкт наказу"></iframe>
{% endif %}
{% endmacro %}
